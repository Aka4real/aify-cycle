          - generic: ⚠️
          - generic:
            - strong: NOT A MEDICAL DEVICE OR CONTRACEPTIVE METHOD
            - paragraph:
              - text: AifyCycle is designed solely for educational, lifestyle, and menstrual cycle tracking purposes. It is
              - strong: NOT
              - text: an FDA-cleared, CE-marked, or medical diagnostic device. Cycle estimations must never be relied upon as a birth control or contraceptive method.
        - heading "1. Non-Diagnostic Information" [level=4]
        - paragraph: The predictions, phase insights, hormone rhythm guides, and AI coaching provided by Aify are based on statistical averages and user-logged inputs. They do not constitute clinical diagnoses for gynecological or endocrine conditions, including but not limited to Polycystic Ovary Syndrome (PCOS), Endometriosis, Uterine Fibroids, Premenstrual Dysphoric Disorder (PMDD), or Pregnancy.
        - heading "2. Emergency Red-Flag Protocols" [level=4]
        - paragraph:
          - text: If you experience any of the following symptoms, please seek
          - strong: immediate emergency medical care
          - text: "or contact local emergency services (e.g., 911/112):"
        - list:
          - listitem: Sudden, severe, sharp, or unbearable pelvic or abdominal pain.
          - listitem: Menstrual bleeding so heavy it soaks through one or more pads/tampons every hour for two consecutive hours.
          - listitem: High fever with chills, vomiting, sunburn-like rash, or foul-smelling vaginal discharge during or following tampon use (potential indicators of Toxic Shock Syndrome or severe pelvic infection).
          - listitem: Dizziness, fainting, confusion, or difficulty breathing accompanying pelvic pain or bleeding.
        - heading "3. Always Consult a Licensed Healthcare Professional" [level=4]
        - paragraph: Never disregard professional medical advice or delay seeking medical evaluation because of information presented by this application or generated by its AI Coach. Always consult a licensed physician, gynecologist, or healthcare provider for diagnosis and treatment.
      - generic:
        - button "I Understand & Acknowledge"
