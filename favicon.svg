<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1224" />
      <stop offset="50%" stop-color="#1A0D1B" />
      <stop offset="100%" stop-color="#0E0711" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 142, 168, 0.6)" />
      <stop offset="50%" stop-color="rgba(214, 93, 177, 0.3)" />
      <stop offset="100%" stop-color="rgba(132, 94, 194, 0.2)" />
    </linearGradient>

    <!-- Flower Petal Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5376" />
      <stop offset="40%" stop-color="#FF758C" />
      <stop offset="80%" stop-color="#FFAAA6" />
      <stop offset="100%" stop-color="#FFD3B6" />
    </linearGradient>

    <!-- Center Glow Gradient -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2E2" stop-opacity="1" />
      <stop offset="35%" stop-color="#FF8DA1" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#D65DB1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#845EC2" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="petalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow Behind Flower -->
  <circle cx="256" cy="256" r="140" fill="url(#centerGlow)" opacity="0.75" />

  <!-- 5-Petal Blooming Cherry Blossom (Aify Brand Flower) -->
  <g transform="translate(256, 256)" filter="url(#petalGlow)">
    <!-- Petal 1 (Top) -->
    <path d="M 0,-20 C -45,-75 -65,-130 -30,-165 C 0,-190 0,-190 0,-175 C 0,-190 0,-190 30,-165 C 65,-130 45,-75 0,-20 Z" fill="url(#petalGrad)" opacity="0.95" />
    <!-- Petal 2 (Top Right) -->
    <path d="M 0,-20 C -45,-75 -65,-130 -30,-165 C 0,-190 0,-190 0,-175 C 0,-190 0,-190 30,-165 C 65,-130 45,-75 0,-20 Z" fill="url(#petalGrad)" transform="rotate(72)" opacity="0.95" />
    <!-- Petal 3 (Bottom Right) -->
    <path d="M 0,-20 C -45,-75 -65,-130 -30,-165 C 0,-190 0,-190 0,-175 C 0,-190 0,-190 30,-165 C 65,-130 45,-75 0,-20 Z" fill="url(#petalGrad)" transform="rotate(144)" opacity="0.95" />
    <!-- Petal 4 (Bottom Left) -->
    <path d="M 0,-20 C -45,-75 -65,-130 -30,-165 C 0,-190 0,-190 0,-175 C 0,-190 0,-190 30,-165 C 65,-130 45,-75 0,-20 Z" fill="url(#petalGrad)" transform="rotate(216)" opacity="0.95" />
    <!-- Petal 5 (Top Left) -->
    <path d="M 0,-20 C -45,-75 -65,-130 -30,-165 C 0,-190 0,-190 0,-175 C 0,-190 0,-190 30,-165 C 65,-130 45,-75 0,-20 Z" fill="url(#petalGrad)" transform="rotate(288)" opacity="0.95" />

    <!-- Center Stamen Core -->
    <circle cx="0" cy="0" r="28" fill="#FFF4E6" />
    <circle cx="0" cy="0" r="16" fill="#FFB07C" />
  </g>
</svg>
