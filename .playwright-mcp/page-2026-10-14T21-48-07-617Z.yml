        - paragraph:
          - text: At
          - strong: AifyCycle
          - text: ", we believe your intimate reproductive health data belongs exclusively to you. We are committed to upholding the highest global data privacy standards, including the EU/UK General Data Protection Regulation (GDPR), the California Consumer Privacy Act (CCPA/CPRA), and the FTC Health Breach Notification Rule."
        - heading "1. Local-First Architecture" [level=4]
        - paragraph:
          - text: Your cycle history, symptom logs, mood notes, water/sleep records, and learned health preferences are stored locally in your browser's local sandbox storage (Web Storage API). We do
          - strong: not
          - text: operate a cloud database harvesting your cycle data, nor do we sell, rent, or monetize your sensitive personal data to third-party data brokers, insurers, or advertisers.
        - heading "2. Google Gemini AI Processing" [level=4]
        - paragraph: When you interact with our AI Coach, conversation prompts and relevant cycle parameters are routed via our secure server proxy to Google's Gemini 3.6 Flash API. In accordance with enterprise Google Cloud AI governance, prompts sent to Gemini via paid API keys are not used to train foundation models without explicit consent.
        - heading "3. Anonymous Usage Telemetry" [level=4]
        - paragraph: To monitor model latency and feature stability, AifyCycle collects aggregated local telemetry (such as session counts, query latency, and feature usage). You can toggle telemetry off at any time in Settings.
        - heading "4. Your Privacy Rights (GDPR / CCPA)" [level=4]
        - list:
          - listitem:
            - strong: "Right to Access & Portability:"
            - text: Export your complete data record in open JSON format at any time.
          - listitem:
            - strong: "Right to Rectification:"
            - text: Edit or correct any logged date or symptom directly in the app.
          - listitem:
            - strong: "Right to Erasure (Right to be Forgotten):"
            - text: Permanently wipe all accounts, logs, memories, and telemetry with a single click in Settings.
